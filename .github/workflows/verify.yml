# Vérifie ce que ce dépôt PROMET, pas ce qu'il serait agréable d'afficher.
#
# Un badge vert qui ne teste rien est pire qu'aucun badge: il demande une
# confiance qu'il n'a pas gagnée. Ce workflow contrôle donc trois choses
# concrètes et vérifiables depuis le contenu publié:
#
#   1. le code Swift publié est syntaxiquement valide;
#   2. le SDK Python s'importe et son exemple est cohérent;
#   3. chaque lien interne du README pointe sur un fichier qui existe —
#      un lien mort dans un README est la première chose qu'un visiteur trouve.
name: verify

on:
  push: {branches: [main]}
  pull_request: {branches: [main]}
  workflow_dispatch:

jobs:
  swift:
    name: Le code crypto publié compile
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Analyse syntaxique de src/
        run: |
          set -e
          fail=0
          for f in src/*.swift; do
            if swiftc -parse "$f" 2>/tmp/err; then
              echo "ok    $f"
            else
              # Un fichier extrait de l'app peut référencer des types qui ne
              # sont pas publiés ici. On distingue donc une erreur de SYNTAXE
              # (un vrai défaut du fichier) d'un symbole manquant (attendu).
              if grep -q "cannot find\|use of unresolved\|no such module" /tmp/err; then
                echo "ok    $f  (symboles hors périmètre publié)"
              else
                echo "ERREUR $f"; sed -n '1,5p' /tmp/err; fail=1
              fi
            fi
          done
          exit $fail

  python:
    name: Le SDK bot s'importe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests
      - name: Import et compilation
        run: |
          python -m compileall -q sdk/
          cd sdk && python -c "import oshi_bot; print('SDK importé:', oshi_bot.__name__)"

  links:
    name: Aucun lien mort dans le README
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier chaque chemin relatif
        run: |
          python3 - <<'PY'
          import re, os, sys
          missing = []
          for md in ["README.md", "CONTRIBUTING.md"]:
              if not os.path.exists(md): continue
              for link in re.findall(r'\]\(([^)]+)\)', open(md, encoding='utf-8').read()):
                  if link.startswith(('http', 'mailto:', '#')): continue
                  path = link.split('#')[0]
                  if path and not os.path.exists(path):
                      missing.append(f"{md} -> {path}")
              for src in re.findall(r'src="([^"]+)"', open(md, encoding='utf-8').read()):
                  if src.startswith('http'): continue
                  if not os.path.exists(src):
                      missing.append(f"{md} -> {src} (image)")
          if missing:
              print("LIENS MORTS:"); [print("  ", m) for m in missing]; sys.exit(1)
          print("tous les liens internes pointent sur un fichier existant")
          PY
