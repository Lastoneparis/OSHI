org.gradle.jvmargs=-Xmx6144m -Dfile.encoding=UTF-8 --add-opens=jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED

# Kotlin daemon JVM args for kapt
kotlin.daemon.jvmargs=-Xmx4096m --add-opens=jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED

android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Enable BuildConfig generation
android.defaults.buildfeatures.buildconfig=true

# Optimized resource shrinking (R8).
#
# Play Console flags this as "Optimized resource shrinking is not enabled".
# Read from the bundle itself, not from the build script: every AAB carries
# BUNDLE-METADATA/com.android.tools/r8.json, and 1.6.24/64 shipped with
#   "resourceOptimization": { "isOptimizedShrinkingEnabled": false }
#
# AGP 8.13.1 turns it on only when ALL FOUR hold
# (R8ResourceShrinkingParametersKt.runOptimizedShrinkingWithR8):
#   isShrinkResources          -> already true for release
#   android.r8.integratedResourceShrinking -> defaults true
#   android.nonFinalResIds                 -> defaults true
#   android.r8.optimizedResourceShrinking  -> defaults FALSE  <- the only gap
#
# So the AGP 9 upgrade Play also asks for is NOT required to clear this: in
# 8.13.1 the option is Experimental and off, and 9.0 is simply where it becomes
# enforced by default. One line buys the same result on the toolchain we have.
#
# Safe here: aggressive resource shrinking breaks resources resolved by NAME,
# and the app has exactly one such call — FCMService.kt:1156 looks up
# "oshi_ringtone" in res/raw, which does not exist in any source set, so it
# already returns 0 and falls back to the system ringtone.
android.r8.optimizedResourceShrinking=true
